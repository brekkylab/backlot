# Rings the agent-loop routine on claude.ai the moment a maintainer acts, instead of leaving the
# action to wait for the routine's next scheduled run. The routine re-reads the queue itself; the
# issue number sent here is a hint about where to look first, never an instruction.
#
# A `/decision` is recognised on the conversation of an issue or pull request and in a review
# thread alike, so an answer typed inline on a diff rings as well — but only from an owner,
# organisation member or collaborator. This is a public repository, and a run costs the loop
# account's daily allowance; a stranger's comment rings nothing. The routine checks the author's
# write access again before it treats the comment as a decision.
#
# The maintainer hears back at once: 👀 on the issue or the comment when the run is requested,
# 😕 and a comment when it could not be, and a labelled issue is assigned to the loop's account.
# Reactions are posted as the loop's own account when its token is set, and as github-actions
# otherwise. The run adds 🚀 itself when it starts on the item.
#
# `/fire` is behind a dated beta header. When Anthropic moves it, this file is the only thing in
# the repository that changes.
name: Loop doorbell

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write

jobs:
  ring:
    if: >
      (github.event_name == 'issues' && github.event.label.name == 'agent') ||
      (github.event_name != 'issues' && startsWith(github.event.comment.body, '/decision') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    steps:
      - name: Fire the routine
        env:
          URL: ${{ secrets.LOOP_FIRE_URL }}
          TOKEN: ${{ secrets.LOOP_FIRE_TOKEN }}
          GH_TOKEN: ${{ secrets.BREKKYBOT_TOKEN || github.token }}
          BOT: ${{ secrets.BREKKYBOT_TOKEN }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || github.event.pull_request.number }}
          # Where the acknowledgement lands: the issue for a label, the comment for a /decision.
          REACT_TO: >-
            ${{ github.event_name == 'issues' && format('issues/{0}/reactions', github.event.issue.number)
             || github.event_name == 'issue_comment' && format('issues/comments/{0}/reactions', github.event.comment.id)
             || format('pulls/comments/{0}/reactions', github.event.comment.id) }}
        run: |
          react() { gh api -X POST "repos/$REPO/$REACT_TO" -f content="$1" --silent || true; }
          # Without the two secrets there is no routine to ring; a green no-op keeps a fork's
          # workflow list quiet rather than red on every label.
          if [ -z "$URL" ] || [ -z "$TOKEN" ]; then
            echo "::notice::LOOP_FIRE_URL / LOOP_FIRE_TOKEN are not set; nothing to ring."
            exit 0
          fi
          react eyes
          # A labelled issue is the loop's from this moment: assigned to its account, which is
          # what `@me` resolves to under the loop's token. The fallback token has no account to
          # assign, so the run assigns itself when it claims the issue instead.
          if [ "$EVENT" = issues ] && [ -n "$BOT" ]; then
            gh issue edit "$ISSUE" --repo "$REPO" --add-assignee @me >/dev/null || true
          fi
          status=$(curl -sS -o response.json -w '%{http_code}' -X POST "$URL" \
            -H "Authorization: Bearer $TOKEN" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"issue #$ISSUE\"}") || status=000
          cat response.json; echo
          case "$status" in
            2*) exit 0 ;;
          esac
          react confused
          body=$(head -c 300 response.json)
          gh issue comment "$ISSUE" --repo "$REPO" --body "The loop could not be started for this: the routine's fire endpoint answered HTTP $status. $body"
          exit 1
