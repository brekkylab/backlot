[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "backlot"
version = "0.1.0"
description = "Enterprise SaaS read APIs (Slack, Gmail, Drive, GitHub, Jira, Confluence, Notion, S3, HubSpot, Linear, Fireflies) over your own corpus, with per-document ACLs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "khj809", email = "onsealeatang@gmail.com" },
]
keywords = ["mock", "rag", "enterprise-search", "slack", "gmail", "google-drive", "jira", "confluence", "github", "notion", "s3", "amazon-s3", "hubspot", "linear", "graphql", "benchmark"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Testing :: Mocking",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "jsonschema>=4.20",
    "pyjwt[crypto]>=2.8",
    "httpx>=0.27",  # /batch self-dispatches sub-requests in-process via httpx.ASGITransport
    # GraphQL sources (backlot/graphql). The GraphQL.js port, pure Python with no transitive deps:
    # parsing, validation, and error envelopes land close to what the real servers return, and
    # introspection — which Linear's API supports — comes free.
    "graphql-core>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
# Official SDKs used by examples/using-official-sdk/, tests/test_sdk.py (one per service) + the ACL demo.
examples = [
    "httpx>=0.27",
    "slack_sdk>=3.27",
    "PyGithub>=2.3",
    "atlassian-python-api>=3.41",
    "google-api-python-client>=2.120",
    "google-auth>=2.29",
    "notion-client>=3.1",
    "boto3>=1.34",
    "hubspot-api-client>=12",
]
# Mirage examples (examples/using-mirage/): drive the mock through mirage's virtual filesystem.
# The [fuse] extra (mfusepy) powers the optional `--fuse` real-OS-mount path; mounting also needs
# an OS FUSE driver (macFUSE / fuse3), but the pure-Python dep installs fine everywhere.
# Pinned to a compatible release for reproducibility. The examples use SlackConfig.base_url,
# which PyPI 0.0.3 predated a direct-URL git dependency for; 0.0.4 carries it (and declares
# this same [fuse] extra), so a released version now covers what a git pin used to.
mirage = [
    "mirage-ai[fuse]~=0.0.4",
]
# MCP agent examples (examples/using-mcp-with-agents/): drive the mock through a real MCP server.
mcp = [
    "mcp>=1.2",
    "anthropic[mcp]>=0.40",
    "openai>=1.40",
    "openai-agents>=0.1",
    "pyyaml>=6.0",
    "fastmcp>=2.0",
]
# LlamaIndex reader examples (examples/using-llamaindex-readers/): point each official
# llama-index reader at the mock and load Documents. Readers pull their own client libs
# transitively; the ones we configure directly are listed explicitly for clarity.
llamaindex = [
    "llama-index-readers-slack>=0.5",
    "llama-index-readers-google>=0.7",
    "llama-index-readers-github>=0.11",
    "llama-index-readers-jira>=0.6",
    "llama-index-readers-confluence>=0.7",
    "llama-index-readers-notion>=0.5",
    "llama-index-readers-s3>=0.6",
    "llama-index-readers-linear>=0.5",
    # llama-index-readers-hubspot is deliberately NOT listed here — it pins
    # hubspot-api-client<9, which no resolver can reconcile with the >=12 that [examples] needs, so
    # declaring it would make `.[examples,llamaindex]` uninstallable under pip. The pin is
    # over-restrictive rather than a real incompatibility (the reader only calls
    # HubSpot(access_token=...) and crm.{deals,contacts,companies}.get_all(), all present in 12.x
    # and verified working against it), so install it past its own pin:
    #     pip install --no-deps llama-index-readers-hubspot     # or: uv pip install --no-deps ...
    # Its only other dependency is llama-index-core, which the readers above already bring in.
    # Taking 8.x instead would drag in a pkg_resources/setuptools<82 pin AND silently ignore the
    # `host=` override, sending traffic meant for the mock to api.hubapi.com.
    "jira>=3.10",
    "atlassian-python-api>=4.0",
    "slack_sdk>=3.43",
    "google-api-python-client>=2.198",
    "google-auth>=2.55",
    "boto3>=1.40",
    "s3fs>=2026.6",
]

[project.urls]
Homepage = "https://github.com/brekkylab/backlot"
Repository = "https://github.com/brekkylab/backlot"
Issues = "https://github.com/brekkylab/backlot/issues"

[tool.ruff]
# 100, not ruff's default 88: the code was hand-wrapped to ~100 columns long before ruff was
# introduced, and 88 would rewrap 5,317 otherwise-fine lines to no benefit.
line-length = 100

[tool.ruff.lint]
# Ruff's defaults (E4/E7/E9 + F). Deliberately NOT E501: `ruff format` already keeps code inside
# the limit, and the lines that remain over it are long string literals and comment tables (the
# measured-behaviour tables in backlot/google_errors.py and backlot/store.py) that reflowing would ruin.
ignore = ["E402"]  # module-level import not at top: the examples must set sys.path first

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# The app silences this at import (backlot/openapi.py), but pytest resets warning filters per test,
# so suppress it the pytest-native way too. The mock serves several routes on multiple methods
# for vendor fidelity (Slack GET+POST, Jira v2/v3, S3 GET+HEAD); FastAPI warns about the resulting
# duplicate operationIds when building /openapi.json — expected, and collapsed by backlot.openapi.
filterwarnings = [
    "ignore:Duplicate Operation ID:UserWarning",
]

[tool.setuptools.packages.find]
include = ["backlot*"]

[tool.setuptools.package-data]
# Every non-.py file backlot/ ships, so a wheel actually contains what the checkout does.
# tests/test_packaging.py enforces this list stays exhaustive — a new asset under backlot/ with
# no matching glob here fails that test instead of surfacing later as a missing-file crash or a
# confusingly empty schema/engine, only once someone installs the wheel outside this repo.
#   schemas/*.json, schemas/*.md — backlot/validation.py's SCHEMA_DIR; every BYO record fails
#     validation post-install without them. Task 6 extends this table with `data/*.jsonl`.
#   graphql/*.graphql — backlot/graphql/engine.py's from_sdl(), read at import time by
#     routers/linear.py and routers/fireflies.py; missing, `import backlot.main` crashes outright.
#   data/*.jsonl — the hello-world corpus backlot.mock_server() loads with no arguments (Task 7);
#     missing, `pip install backlot` + call it has nothing to serve.
backlot = ["schemas/*.json", "schemas/*.md", "graphql/*.graphql", "data/*.jsonl"]
