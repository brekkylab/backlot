[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "backlot"
# The git tag is the version: setuptools-scm reads it at build time, so nothing here has to be
# edited to cut a release and no build ever has to write to the working tree.
dynamic = ["version"]
description = "A read-only mock of enterprise SaaS knowledge APIs, served over your own corpus with per-document ACLs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "khj809", email = "onsealeatang@gmail.com" },
]
keywords = ["mock", "rag", "slack", "gmail", "google-drive", "jira", "confluence", "github", "notion", "s3", "amazon-s3", "hubspot", "linear", "graphql", "benchmark"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Testing :: Mocking",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "jsonschema>=4.20",
    "typer>=0.27",
    "pyjwt[crypto]>=2.8",
    "httpx>=0.27",  # /batch self-dispatches sub-requests in-process via httpx.ASGITransport
    # The GraphQL.js port: its parse/validate/error envelopes land close to what the real
    # servers return, and introspection comes free. Pure Python, no transitive deps.
    "graphql-core>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.6",
    "httpx>=0.27",
    # starlette 1.6's TestClient wants httpx2; httpx stays for the tests that call it directly.
    "httpx2",
    # Pinned, not a lower bound: a ruff minor can change both the formatter and the lint
    # defaults. CI installs it from here, so local and CI cannot disagree.
    "ruff~=0.15.22",
]
# Official SDKs used by examples/using-official-sdk/, tests/test_sdk.py (one per service) + the ACL demo.
examples = [
    "httpx>=0.27",
    "slack_sdk>=3.27",
    "PyGithub>=2.3",
    "atlassian-python-api>=3.41",
    "google-api-python-client>=2.120",
    "google-auth>=2.29",
    "notion-client>=3.1",
    "boto3>=1.34",
    "hubspot-api-client>=12",
]
# MCP agent examples (examples/using-mcp-with-agents/): drive the mock through a real MCP server.
mcp = [
    "mcp>=1.2",
    "anthropic[mcp]>=0.40",
    "openai>=1.40",
    "openai-agents>=0.1",
    "pyyaml>=6.0",
    # >=3: fastmcp 2.x imports `mcp.shared.exceptions.McpError`, which mcp 2.0 renamed to
    # `MCPError` — so an unbounded pair resolves to two packages that cannot import each other and
    # every MCP test fails inside fastmcp's own module body. 3.x is the version that agrees with a
    # current `mcp`.
    "fastmcp>=3",
]
# LlamaIndex reader examples (examples/using-llamaindex-readers/): point each official
# llama-index reader at the mock and load Documents. The client libs below are the ones the
# examples configure directly; the readers pull the rest transitively.
llamaindex = [
    "llama-index-readers-slack>=0.5",
    "llama-index-readers-google>=0.7",
    "llama-index-readers-github>=0.11",
    "llama-index-readers-jira>=0.6",
    "llama-index-readers-confluence>=0.7",
    "llama-index-readers-notion>=0.5",
    "llama-index-readers-s3>=0.6",
    "llama-index-readers-linear>=0.5",
    # llama-index-readers-hubspot is deliberately absent: it pins hubspot-api-client<9, which no
    # resolver can reconcile with the >=12 that [examples] needs. The pin is over-restrictive, not a
    # real incompatibility, so install it past it:
    #     pip install --no-deps llama-index-readers-hubspot
    "jira>=3.10",
    "atlassian-python-api>=4.0",
    "slack_sdk>=3.43",
    "google-api-python-client>=2.198",
    "google-auth>=2.55",
    "boto3>=1.40",
    "s3fs>=2026.6",
]
# Mirage examples (examples/using-mirage/): drive the mock through mirage's virtual filesystem.
# The [fuse] extra powers the optional `--fuse` real-OS mount, which also needs an OS FUSE driver
# (macFUSE / fuse3) — the Python dep itself installs everywhere.
mirage = [
    # Floor is 0.0.5, not 0.0.4: that release added CALENDAR_API_BASE and FORMS_API_BASE, and
    # `integrations.mirage` rebinds both. `_rebind_mirage_constants` RAISES on a name it cannot
    # find anywhere, so on 0.0.4 `point_google_at` would fail outright rather than degrade.
    "mirage-ai[fuse]~=0.0.5",
]

[project.scripts]
backlot = "backlot.cli:main"

[project.urls]
Homepage = "https://github.com/brekkylab/backlot"
Repository = "https://github.com/brekkylab/backlot"
Issues = "https://github.com/brekkylab/backlot/issues"

[tool.ruff]
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Ruff's defaults (E4/E7/E9 + F). NOT E501: the formatter keeps code inside the limit, and what
# stays over it is long string literals and measured-behaviour comment tables.
ignore = ["E402"]  # module-level import not at top: the examples must set sys.path first

[tool.pytest.ini_options]
testpaths = ["tests"]
# loadfile, not the default: several modules share a module-scoped corpus.
addopts = "-q -n auto --dist loadfile"
# Several routes serve more than one HTTP method for vendor fidelity (Slack GET+POST, Jira v2/v3,
# S3 GET+HEAD), so FastAPI warns about duplicate operationIds — expected, and collapsed by
# backlot.openapi. Silenced at import there too, but pytest resets filters per test.
filterwarnings = [
    "ignore:Duplicate Operation ID:UserWarning",
    # llama-index reads a pydantic field API pydantic itself deprecated; nothing here to change.
    "ignore:Call to deprecated function \\(or staticmethod\\) extra_info:DeprecationWarning",
]

[tool.setuptools_scm]
# Reached only when there is no git metadata to read — a build from an unpacked source tarball
# rather than a clone. Deliberately a version no tag will ever produce, so an artifact built
# that way cannot be mistaken for a release.
fallback_version = "0.0.0"

[tool.setuptools.packages.find]
include = ["backlot*"]

[tool.setuptools.package-data]
# Every non-.py file backlot/ ships. All are read at runtime, so a missing one breaks the install
# rather than degrading it: no schemas and every BYO record fails validation, no .graphql and
# `import backlot.main` raises. tests/test_packaging.py fails on an asset with no glob here.
backlot = ["schemas/*.json", "schemas/*.md", "graphql/*.graphql", "data/*.jsonl"]
