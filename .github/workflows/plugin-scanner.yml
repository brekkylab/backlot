# HOL's plugin-scanner, which the catalogs that list Backlot score this repository with. Running it
# here puts a finding on the pull request that introduces it, rather than in someone else's scan.
#
# Only `critical` fails the run. What it reports as `high` is the product: the fake tokens the
# READMEs, the Linear example and the tests hand out, which a secret detector cannot tell from real
# ones. Gating on `high` would gate on a corpus of plausible credentials, which is the thing being
# shipped.
name: Plugin scanner

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashgraph-online/ai-plugin-scanner-action@06bfa78ffae51fa0bcadf595b4d4a009bea96e42 # v1.2.626
        with:
          fail_on_severity: critical
