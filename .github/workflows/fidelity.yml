# Does the vendor still serve what Backlot claims it does?
#
# On a schedule, never on a pull request. Drift is this project's bug, but it is never the bug of
# whichever pull request happens to be open when a vendor ships a change — so a divergence opens an
# issue rather than failing someone else's merge. Two sources need a credential a fork could not
# read anyway.
name: Fidelity

on:
  schedule:
    # 01:00 UTC is 18:00 the previous day in Pacific daylight time and 17:00 in standard time — the
    # end of a Silicon Valley day either way — and 10:00 the same morning in Seoul.
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "One source to compare. Empty compares every one of them."
        required: false
        type: string

permissions:
  contents: read
  issues: write

jobs:
  # The registry is the list, so adding a source does not also mean editing this file.
  sources:
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.pick.outputs.names }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e .
      - name: Decide which sources to compare
        id: pick
        env:
          CHOSEN: ${{ inputs.source }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from backlot.fidelity import COMPARISONS

          chosen = os.environ.get("CHOSEN", "").strip()
          if chosen and chosen not in COMPARISONS:
              raise SystemExit(f"no comparison for {chosen!r}; one of {sorted(COMPARISONS)}")
          print("names=" + json.dumps([chosen] if chosen else sorted(COMPARISONS)))
          PY

  compare:
    needs: sources
    runs-on: ubuntu-latest
    # Two runs of one source would both find no open issue of its own and both open one.
    concurrency:
      group: fidelity-${{ matrix.source }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.sources.outputs.names) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e .

      - name: Compare ${{ matrix.source }} against its vendor
        id: diff
        env:
          FIREFLIES_API_KEY: ${{ secrets.FIREFLIES_API_KEY }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          set +e
          backlot diff --source ${{ matrix.source }} 2>&1 | tee report.txt
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # Exit 2 is "we could not ask" — an expired key, a vendor outage, a network blip. That is not
      # a fidelity finding and must not open a bug against Backlot.
      - name: Report an unreadable vendor contract
        if: steps.diff.outputs.status == '2'
        run: |
          echo "::warning::${{ matrix.source }}'s contract could not be read; no comparison ran."
          cat report.txt

      # Exit 3 is a credential nobody set. Red, because it is this repository's misconfiguration:
      # warned about and left green, the two sources whose contract is introspection would go
      # uncompared night after night while the run said nothing was wrong.
      - name: Fail on a credential this repository has not set
        if: steps.diff.outputs.status == '3'
        run: |
          cat report.txt
          exit 1

      - name: Report the divergence on this source's issue
        if: steps.diff.outputs.status == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ matrix.source }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PREFIX="Fidelity: $SOURCE diverges from its vendor"
          export PREFIX
          # Only the open issue. A closed one is the finished account of the divergences that were
          # triaged on it, and a later run writing its own report over that body would leave the
          # comments answering a report nobody can read any more. `is_bot` leaves a person's own
          # issue alone. Listed under the label rather than searched, because GitHub indexes issue
          # search asynchronously and an issue opened this morning may not be found by tonight.
          number=$(gh issue list --state open --label fidelity --limit 100 \
            --json number,title,author \
            --jq 'first(.[] | select(.author.is_bot and (.title | startswith(env.PREFIX))) | .number) // empty')
          # The body is rewritten on every run, so this has to answer the same way on every run or
          # each run would rewrite the last one's body and comment about the rewrite. Searching this
          # source's own titles keeps the set to the issues this step has opened for it, which grows
          # only when the open one is closed.
          previous=$(gh issue list --state closed --search "$PREFIX in:title" --limit 50 \
            --json number,title,author \
            --jq '[.[] | select(.author.is_bot and (.title | startswith(env.PREFIX))) | .number] | max // empty')
          # The API refuses a body over 65536 characters, and this step runs under `bash -e`, so
          # that refusal takes the step down: the job would go red with no issue filed and the
          # report only in the run log. A vendor restructuring its document turns a whole baseline
          # into new findings at once — measured against an empty baseline, jira's report is 135k
          # characters and github's 134k — so the report is capped well under the limit.
          report=$(cat report.txt)
          if [ "${#report}" -gt 55000 ]; then
            # Sliced, not `head -c`: the test above counts characters, and cutting bytes leaves
            # half of a multibyte character at the seam — the report is full of `·` and `…`.
            report="$(printf '%s\n… truncated at 55000 of %d characters. The whole report is in the run log: %s' \
              "${report:0:55000}" "${#report}" "$RUN_URL")"
          fi
          intro="\`backlot diff --source $SOURCE\` reports divergences the baseline does not acknowledge. Each is either a bug in Backlot or a deliberate gap; \`backlot diff --source $SOURCE --update-baseline\` writes the entry for a gap, and a note saying why it is deliberate is added by hand in the review that follows. This body is the latest scheduled run's report, rewritten in place. Closing this issue keeps it as the account of what was triaged; a run that still diverges opens a new one."
          if [ -n "$previous" ]; then
            intro="$intro Previously reported in #$previous."
          fi
          body=$(printf '%s\n\n```\n%s\n```\n' "$intro" "$report")
          if [ -z "$number" ]; then
            # The date the divergence was first seen, so this issue and the closed ones before it
            # are told apart in a listing.
            gh issue create --title "$PREFIX (first seen $(date -u +%F))" --label fidelity --body "$body"
            exit 0
          fi
          if [ "$(gh issue view "$number" --json body --jq .body)" != "$body" ]; then
            gh issue edit "$number" --body "$body"
            gh issue comment "$number" --body "The divergences on \`$SOURCE\` changed. The issue body now carries the latest report."
          fi

      - name: Fail the run so the schedule shows red
        if: steps.diff.outputs.status == '1'
        run: exit 1
