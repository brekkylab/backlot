name: Release

on:
  release:
    types: [published]
  # The dry run. Builds exactly what a release would and stops before the upload, so the path can
  # be exercised on a branch with no tag to cut and no release to undo.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, but do not upload to PyPI."
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm reads the version out of git metadata, and a shallow clone carries no
          # tags — without this every release would build a 0.0.1.devN guess instead of the tag.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the build tooling
        run: pip install build
      - name: Build the sdist and the wheel
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    # A dry run stops here. workflow_dispatch can still publish, but only when asked outright —
    # the escape hatch for a release whose upload failed after the tag was already cut.
    if: ${{ github.event_name == 'release' || inputs.dry_run == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install twine
        run: pip install twine
      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.BACKLOT_PYPI_TOKEN }}
        run: twine upload dist/*
