# Rings the agent-loop routine on claude.ai the moment a maintainer acts, instead of leaving the
# action to wait for the routine's next scheduled run. The routine re-reads the queue itself; the
# issue number sent here is a hint about where to look first, never an instruction.
#
# A `/decision` is recognised on the conversation of an issue or pull request and in a review
# thread alike, so an answer typed inline on a diff rings as well — but only from an owner,
# organisation member or collaborator. This is a public repository, and a run costs the loop
# account's daily allowance; a stranger's comment rings nothing. The routine checks the author's
# write access again before it treats the comment as a decision.
#
# A review on one of the loop's pull requests rings too, so the loop answers a reviewer within
# minutes rather than at the next scheduled run. GitHub wraps every inline reply in a review of
# its own, so the review event covers a full review and a single reply alike, and one submission
# with many comments is one event. A review by the pull request's own author is the loop
# answering, never a reviewer, and does not ring. Reviews on one pull request are debounced: each
# waits ninety seconds and a newer one cancels it, so a reviewer who leaves three replies in a row
# starts one run.
#
# The maintainer hears back at once: 👀 on the issue, the comment or the pull request when the
# run is requested, 😕 and a comment when it could not be, and a labelled issue is assigned to
# the loop's account. Each of those is tried as the loop's own account first and as
# github-actions when that token is missing or refused, so a token that lapsed or lacks a
# permission costs the maintainer the name on the reaction, never the reaction. The run adds 🚀
# itself when it starts on the item.
#
# Run by hand, the doorbell can send the run to a branch of the loop's own files: the routine
# checks the branch out before it runs the skill, so a change to the skill, the reviewers or this
# file is tried in the cloud before it is merged. Only a dispatch can name a branch, only the head
# of an open pull request is accepted, and the run is a rehearsal unless asked to be live.
#
# `/fire` is behind a dated beta header. When Anthropic moves it, this file is the only thing in
# the repository that changes.
name: Loop doorbell

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue or pull request number the run is about"
        required: true
        type: string
      branch:
        description: "Branch of the loop's files to run; empty runs main. Must head an open pull request."
        required: false
        type: string
      mode:
        description: "rehearsal writes nothing to GitHub; live is an ordinary run"
        required: false
        default: rehearsal
        type: choice
        options: [rehearsal, live]

permissions:
  issues: write
  pull-requests: write

# Reviews on one pull request share a group and cancel each other; everything else runs alone.
concurrency:
  group: ${{ github.event_name == 'pull_request_review' && format('review-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  ring:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'agent') ||
      (github.event_name == 'pull_request_review' &&
       startsWith(github.event.pull_request.head.ref, 'claude/') &&
       github.event.review.user.login != github.event.pull_request.user.login &&
       contains(fromJSON('["changes_requested", "commented"]'), github.event.review.state) &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association)) ||
      ((github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
       startsWith(github.event.comment.body, '/decision') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    steps:
      - name: Fire the routine
        env:
          URL: ${{ secrets.LOOP_FIRE_URL }}
          TOKEN: ${{ secrets.LOOP_FIRE_TOKEN }}
          BOT_TOKEN: ${{ secrets.BREKKYBOT_TOKEN }}
          ACTIONS_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue || github.event.issue.number || github.event.pull_request.number }}
          BRANCH: ${{ inputs.branch }}
          MODE: ${{ inputs.mode }}
          # Where the acknowledgement lands: the issue for a label or a dispatch, the pull request
          # for a review, the comment for a /decision.
          REACT_TO: >-
            ${{ (github.event_name == 'issues' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request_review') && format('issues/{0}/reactions', inputs.issue || github.event.issue.number || github.event.pull_request.number)
             || github.event_name == 'issue_comment' && format('issues/comments/{0}/reactions', github.event.comment.id)
             || format('pulls/comments/{0}/reactions', github.event.comment.id) }}
        run: |
          # Runs a gh command as the loop's account, and as github-actions when that fails.
          as_loop() {
            if [ -n "$BOT_TOKEN" ] && GH_TOKEN="$BOT_TOKEN" "$@" 2>bot.err; then return 0; fi
            [ -n "$BOT_TOKEN" ] && echo "::warning::the loop's token could not: $(head -c 200 bot.err); using github-actions"
            GH_TOKEN="$ACTIONS_TOKEN" "$@" || true
          }
          react() { as_loop gh api -X POST "repos/$REPO/$REACT_TO" -f content="$1" --silent; }
          # Without the two secrets there is no routine to ring; a green no-op keeps a fork's
          # workflow list quiet rather than red on every label.
          if [ -z "$URL" ] || [ -z "$TOKEN" ]; then
            echo "::notice::LOOP_FIRE_URL / LOOP_FIRE_TOKEN are not set; nothing to ring."
            exit 0
          fi
          # A branch is a maintainer's dispatch and nothing else, and it has to be the head of an
          # open pull request: the payload is an instruction to run that branch's files.
          text="issue #$ISSUE"
          if [ -n "$BRANCH" ]; then
            case "$BRANCH" in
              *[!A-Za-z0-9._/-]*|-*|*/-*|*..*) echo "::error::branch name '$BRANCH' is not accepted"; exit 1 ;;
            esac
            heads=$(GH_TOKEN="$ACTIONS_TOKEN" gh pr list --repo "$REPO" --state open --head "$BRANCH" --json number --jq 'length')
            if [ "$heads" = 0 ]; then
              echo "::error::'$BRANCH' is not the head of an open pull request"; exit 1
            fi
            text="$text branch: $BRANCH mode: ${MODE:-rehearsal}"
          elif [ "$EVENT" = workflow_dispatch ] && [ "$MODE" = rehearsal ]; then
            text="$text mode: rehearsal"
          fi
          # A review is debounced: wait, and let a newer review on the same pull request cancel
          # this run, so a burst of replies rings once.
          if [ "$EVENT" = pull_request_review ]; then
            sleep 90
            text="$text review"
          fi
          react eyes
          # A labelled issue is the loop's from this moment. `@me` is whoever the token is, so
          # this is only done under the loop's own token; the run assigns itself when it claims.
          if [ "$EVENT" = issues ] && [ -n "$BOT_TOKEN" ]; then
            GH_TOKEN="$BOT_TOKEN" gh issue edit "$ISSUE" --repo "$REPO" --add-assignee @me >/dev/null \
              || echo "::warning::the loop's token could not assign #$ISSUE"
          fi
          echo "payload: $text"
          status=$(curl -sS -o response.json -w '%{http_code}' -X POST "$URL" \
            -H "Authorization: Bearer $TOKEN" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d "$(jq -cn --arg t "$text" '{text: $t}')") || status=000
          cat response.json; echo
          case "$status" in
            2*) exit 0 ;;
          esac
          react confused
          body=$(head -c 300 response.json)
          as_loop gh issue comment "$ISSUE" --repo "$REPO" --body "The loop could not be started for this: the routine's fire endpoint answered HTTP $status. $body"
          exit 1
