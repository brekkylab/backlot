# Linear's GraphQL API, as served by the mock at `POST /linear/graphql`.
#
# PROVENANCE — this is not hand-drafted from the docs. The object types below were generated
# from `@linear/sdk`'s OWN generated documents: the SDK ships one pre-built document per
# operation, and `client.issues()` alone selects 171 field nodes across 11 fragments
# (`reactionData`, `previousIdentifiers`, `slaBreachesAt`, `prioritySortOrder`, …). graphql-core
# validates before executing, so a single missing field would reject the whole query and no
# `@linear/sdk` call would work at all. Field types come from the SDK's own TypeScript
# declarations, so `estimate` is `Float` and `dueDate` is `TimelessDate` exactly as upstream.
#
# The generated set covers the documents behind `issues` / `issue` / `team` / `teams` /
# `team.issues` / `comments` / `issue.comments` / `issue.labels` / `users` / `viewer`, plus the
# by-id roots (`user`, `workflowState`, `project`, `issueLabel`, `cycle`) that the SDK's LAZY
# relation accessors hit — `await issue.state` fires a fresh `workflowState(id:)` query rather
# than reading the value out of the issue it just fetched.
#
# WHAT IS REAL vs WHAT IS A STUB. The mock has data behind issues, comments, teams, and the
# `state` / `project` / `cycle` / `labels` / `creator` / `assignee` relations on an issue.
# Everything else the SDK's fragments demand (`botActor`, `syncedWith`, `favorite`, the SLA
# timestamps, the board/sort orders) resolves to null or an empty list: declared so real SDK
# documents validate, not backed by a corpus. Fields are never silently faked — a null here means
# "this mock has no such data", which is a legal Linear response. The one deliberate exception is
# `Issue.sharedAccess`, which is NON-null because the SDK constructs it unconditionally and a null
# crashes the client; its values ("nothing is shared") are accurate anyway.
#
# OUT OF SCOPE (deliberate): mutations — there is no Mutation type, so introspection reports
# `mutationType: null` rather than advertising writes that would fail. Also attachments,
# webhooks, roadmaps/initiatives and `documents` as first-class queries.

# --- custom scalars ---------------------------------------------------------------
# Linear's own scalar names. graphql-core passes them through unchanged, which is what we
# want: `DateTime` is an ISO-8601 string, `TimelessDate` a bare `YYYY-MM-DD`, and the JSON
# scalars carry already-shaped objects.
scalar DateTime
scalar TimelessDate
scalar JSON
scalar JSONObject
scalar UUID

# --- root -------------------------------------------------------------------------
# Read-only: Linear's mutations are out of scope, so there is no Mutation type at all
# (introspection therefore reports `mutationType: null`, which is honest — a declared-but-
# unimplemented Mutation root would let a client's create call validate and then fail).
type Query {
  """One issue by its UUID **or** by its human identifier (`ENG-123`), as the real API accepts both."""
  issue(id: String!): Issue!
  issues(after: String, before: String, filter: IssueFilter, first: Int, includeArchived: Boolean, last: Int, orderBy: PaginationOrderBy, sort: [IssueSortInput!]): IssueConnection!
  """One team by its UUID **or** by its key (`ENG`)."""
  team(id: String!): Team!
  teams(after: String, before: String, filter: TeamFilter, first: Int, includeArchived: Boolean, last: Int, orderBy: PaginationOrderBy): TeamConnection!
  comments(after: String, before: String, filter: CommentFilter, first: Int, includeArchived: Boolean, last: Int, orderBy: PaginationOrderBy): CommentConnection!
  users(after: String, before: String, filter: UserFilter, first: Int, includeArchived: Boolean, includeDisabled: Boolean, last: Int, orderBy: PaginationOrderBy, sort: [UserSortInput!]): UserConnection!
  """The authenticated user — how a client confirms which identity (and therefore which ACL scope) its credential resolved to."""
  viewer: User!

  # An `@linear/sdk` relation accessor (`await issue.state`, `await issue.assignee`) does NOT read
  # the value out of the issue it already fetched — it fires a fresh query for that entity by id.
  # These four roots are what make `issue.state` / `.assignee` / `.creator` / `.project` /
  # `.cycle` / `.labels()` work instead of failing with "Cannot query field on type 'Query'".
  user(id: String!): User!
  workflowState(id: String!): WorkflowState!
  project(id: String!): Project!
  issueLabel(id: String!): IssueLabel!
  cycle(id: String!): Cycle!
  attachment(id: String!): Attachment!
  issueRelation(id: String!): IssueRelation!
  release(id: String!): Release!
}

# --- connections & entity types -----------------------------------------------------
# PageInfo, the Issue/Comment/Team/User/IssueLabel connections, and the WorkflowState / Project /
# Cycle / IssueLabel entity types all come from the generated block below: the SDK fetches an
# issue's relations with SEPARATE queries (`workflowState(id:)`, `user(id:)`, `project(id:)`,
# `issue_labels`), each selecting that type's own full fragment, so their real shapes are
# available and there is nothing to hand-write.

# --- id-only stubs ------------------------------------------------------------------
# Every one of these appears in the SDK's generated fragments as `field { id }` and nowhere
# else. They exist so those documents validate; the mock has no data behind them, so the
# owning field always resolves to null and the type is never actually reached.
type AgentSession { id: ID! }
type Document { id: ID! }
type ExternalUser { id: ID! }
type Favorite { id: ID! }
type Initiative { id: ID! }
type InitiativeUpdate { id: ID! }
type IntegrationsSettings { id: ID! }
type ProjectMilestone { id: ID! }
type ProjectStatus { id: ID! }
type ReleasePipeline { id: ID! }
type ReleaseStage { id: ID! }
type ProjectUpdate { id: ID! }
type Template { id: ID! }
type TriageResponsibility { id: ID! }

union ExternalEntityInfoMetadata =
    ExternalEntityInfoGithubMetadata
  | ExternalEntityInfoJiraMetadata
  | ExternalEntitySlackMetadata

# --- pagination / sorting inputs -----------------------------------------------------
enum PaginationOrderBy { createdAt updatedAt }
enum PaginationSortOrder { Ascending Descending }
enum PaginationNulls { first last }

input TitleSort { nulls: PaginationNulls, order: PaginationSortOrder }
input PrioritySort { nulls: PaginationNulls, order: PaginationSortOrder }
input EstimateSort { nulls: PaginationNulls, order: PaginationSortOrder }
input CreatedAtSort { nulls: PaginationNulls, order: PaginationSortOrder }
input UpdatedAtSort { nulls: PaginationNulls, order: PaginationSortOrder }

"""The issue sort keys the mock can order by. Linear's own input is wider; anything it
accepts and this does not is a validation error here rather than a silently ignored sort."""
input IssueSortInput {
  title: TitleSort
  priority: PrioritySort
  estimate: EstimateSort
  createdAt: CreatedAtSort
  updatedAt: UpdatedAtSort
}

input UserSortInput { name: NameSort, createdAt: CreatedAtSort, updatedAt: UpdatedAtSort }
input NameSort { nulls: PaginationNulls, order: PaginationSortOrder }

# --- filter inputs --------------------------------------------------------------------
# Linear's filter inputs are enormous (every field crossed with every comparator). These
# declare ONLY what the mock genuinely evaluates, on purpose: an unsupported key then comes
# back as a GraphQL validation error naming the field, instead of being accepted and quietly
# ignored — which would hand a client a full, wrong result set.
input IDComparator { eq: ID, neq: ID, in: [ID!], nin: [ID!] }

input StringComparator {
  eq: String, neq: String, in: [String!], nin: [String!]
  contains: String, containsIgnoreCase: String
  startsWith: String, endsWith: String
  eqIgnoreCase: String, neqIgnoreCase: String
}

input NullableStringComparator {
  eq: String, neq: String, in: [String!], nin: [String!]
  contains: String, containsIgnoreCase: String
  startsWith: String, endsWith: String
  eqIgnoreCase: String, neqIgnoreCase: String
  null: Boolean
}

input NumberComparator {
  eq: Float, neq: Float, lt: Float, lte: Float, gt: Float, gte: Float
  in: [Float!], nin: [Float!]
}

input NullableNumberComparator {
  eq: Float, neq: Float, lt: Float, lte: Float, gt: Float, gte: Float
  in: [Float!], nin: [Float!]
  null: Boolean
}

input DateComparator { eq: DateTime, neq: DateTime, lt: DateTime, lte: DateTime, gt: DateTime, gte: DateTime }

input NullableDateComparator {
  eq: DateTime, neq: DateTime, lt: DateTime, lte: DateTime, gt: DateTime, gte: DateTime
  null: Boolean
}

input WorkflowStateFilter {
  # No `id`: a state id is derived from (team, name), so it cannot be pushed down as a predicate
  # over the single `state` column. Filter by `name` or `type` instead.
  name: StringComparator
  type: StringComparator
  and: [WorkflowStateFilter!]
  or: [WorkflowStateFilter!]
}

input UserFilter {
  id: IDComparator
  name: StringComparator
  displayName: StringComparator
  email: StringComparator
  and: [UserFilter!]
  or: [UserFilter!]
}

input NullableUserFilter {
  id: IDComparator
  name: StringComparator
  displayName: StringComparator
  email: StringComparator
  null: Boolean
  and: [NullableUserFilter!]
  or: [NullableUserFilter!]
}

input TeamFilter {
  id: IDComparator
  key: StringComparator
  name: StringComparator
  and: [TeamFilter!]
  or: [TeamFilter!]
}

input NullableProjectFilter {
  id: IDComparator
  name: StringComparator
  null: Boolean
  and: [NullableProjectFilter!]
  or: [NullableProjectFilter!]
}

input IssueLabelFilter {
  name: StringComparator
  and: [IssueLabelFilter!]
  or: [IssueLabelFilter!]
}

input IssueLabelCollectionFilter {
  some: IssueLabelFilter
  every: IssueLabelFilter
  and: [IssueLabelCollectionFilter!]
  or: [IssueLabelCollectionFilter!]
}

"""Attachment fields the mock can evaluate. Linear's own input is wider; as everywhere else in
this schema, only what is implemented is declared, so an unsupported key is a validation error
rather than a filter that is dropped and answered with the full set."""
input AttachmentFilter {
  id: IDComparator
  title: StringComparator
  subtitle: NullableStringComparator
  url: StringComparator
  sourceType: NullableStringComparator
  and: [AttachmentFilter!]
  or: [AttachmentFilter!]
}

input ReleaseFilter {
  id: IDComparator
  name: StringComparator
  slugId: StringComparator
  and: [ReleaseFilter!]
  or: [ReleaseFilter!]
}

input CommentFilter {
  id: IDComparator
  body: StringComparator
  createdAt: DateComparator
  updatedAt: DateComparator
  and: [CommentFilter!]
  or: [CommentFilter!]
}

input IssueFilter {
  id: IDComparator
  title: StringComparator
  description: NullableStringComparator
  branchName: StringComparator
  priority: NullableNumberComparator
  estimate: NullableNumberComparator
  dueDate: NullableDateComparator
  createdAt: DateComparator
  updatedAt: DateComparator
  completedAt: NullableDateComparator
  canceledAt: NullableDateComparator
  state: WorkflowStateFilter
  assignee: NullableUserFilter
  creator: UserFilter
  team: TeamFilter
  project: NullableProjectFilter
  labels: IssueLabelCollectionFilter
  and: [IssueFilter!]
  or: [IssueFilter!]
}

