name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        # -n auto: pytest-xdist comes from the dev extra; --dist loadfile is in pyproject's addopts.
        run: pytest -n auto

      # Node is for the Linear example at the end of this job: `@linear/sdk` is the only client
      # Linear publishes and there is no official Python one, so pytest cannot drive it.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the Linear example's dependencies
        working-directory: examples/using-official-sdk/linear
        run: npm install
      - name: Typecheck the Linear example
        working-directory: examples/using-official-sdk/linear
        run: npx tsc --noEmit
      - name: Run the Linear example against a mock it starts itself
        working-directory: examples/using-official-sdk/linear
        env:
          PYTHON: python
        run: npx tsx index.ts

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install "$(grep -oE 'ruff~=[0-9.]+' pyproject.toml)"
      - name: ruff format --check
        run: ruff format --check .
      - name: ruff check
        run: ruff check .
