name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/using-official-sdk/linear/package-lock.json
      - uses: astral-sh/setup-uv@v10.0.1

      - name: Install
        run: pip install -e ".[dev,examples,mcp,llamaindex,mirage]"
      - name: Install the HubSpot reader past its stale pin
        run: pip install --no-deps "llama-index-readers-hubspot<0.6"
      - name: Fetch the AWS MCP server the S3 test drives
        # tests/test_mcp.py runs this through `uvx …@latest`, which is the point — the mock is
        # proved against the server awslabs ships today. Downloading it here rather than there
        # keeps the fetch off the clock the MCP client's `initialize` waits on, which a uv cache
        # that has not seen this version otherwise loses.
        run: uv tool install "awslabs.aws-api-mcp-server@latest"
      - name: Unit tests
        run: pytest -rs

      - name: Install the Linear example's dependencies
        working-directory: examples/using-official-sdk/linear
        run: npm install
      - name: Typecheck the Linear example
        working-directory: examples/using-official-sdk/linear
        run: npx tsc --noEmit
      - name: Run the Linear example against a mock it starts itself
        working-directory: examples/using-official-sdk/linear
        env:
          PYTHON: python
        run: npx tsx index.ts

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install "$(grep -oE 'ruff~=[0-9.]+' pyproject.toml)"
      - name: ruff format --check
        run: ruff format --check .
      - name: ruff check
        run: ruff check .
